<!DOCTYPE html>
<html lang="{{ site.LanguageCode | default "en-us" }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <style>
      body { max-width: 50rem; margin: 2rem auto; padding: 0 1rem;
             font-family: system-ui, sans-serif; line-height: 1.6; }
      nav a { margin-right: 1rem; }
      pre { background: #f5f5f5; padding: 0.75rem; overflow-x: auto; }
      code { background: #f5f5f5; padding: 0.1rem 0.3rem; }
      pre code { background: none; padding: 0; }
      table { border-collapse: collapse; }
      th, td { border: 1px solid #ccc; padding: 0.3rem 0.6rem; }
      .admonition { border-left: 4px solid #888; padding: 0.5rem 1rem; margin: 1rem 0; background: #fafafa; }
      .admonition-title { font-weight: bold; margin: 0 0 0.25rem; }
      .admonition.warning { border-color: #e0a800; }
      .admonition.danger, .admonition.error { border-color: #d33; }
      .admonition.tip, .admonition.hint { border-color: #28a745; }
      figure { margin: 1rem 0; }
      figure figcaption { font-size: 0.9em; color: #555; }
    </style>
  </head>
  <body>
    <header>
      <nav><a href="{{ "/" | relURL }}">{{ site.Title }}</a></nav>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
  </body>
</html>
