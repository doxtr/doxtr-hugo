name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Install package with dev extras
      run: pip install -e ".[dev]" || pip install -e .
    - name: Run unit tests with coverage
      # No external binaries required (no hugo/plantuml/dot) — backend calls
      # are monkeypatched and the Hugo stage lives in the harness.
      run: python -m pytest tests/ -v --tb=short --cov=doxtr_hugo --cov-fail-under=75
    - name: Verify import
      run: python -c "import doxtr_hugo; print(doxtr_hugo.__version__)"
